{% macro enterprise_form(site, sectors, resources, types) %}
<form method="post" action="{{ '/admin/enterprises/edit/' ~ site.id if site else '/admin/enterprises/add' }}" class="admin-enterprise-form">
    {% if site %}
    <input type="hidden" name="storage_multiplier" value="{{ site.storage_multiplier }}">
    {% endif %}
    <label>Назва <input name="name" maxlength="120" value="{{ site.name if site else '' }}" required></label>
    <label>Сектор
        <select name="sector" required>
            {% for sector in sectors %}
            <option value="{{ sector.key }}"{% if site and site.sector == sector.key %} selected{% endif %}>{{ sector.name }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Ресурс
        <select name="resource_type" required>
            {% for key, label in resources.items() %}
            <option value="{{ key }}"{% if site and site.resource_type == key %} selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Тип підприємства
        <select name="production_type" required>
            {% for key, label in types.items() %}
            <option value="{{ key }}"{% if site and site.production_type == key %} selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Площа <input type="number" name="area" min="1" max="999" value="{{ site.area if site else 100 }}" required></label>
    <label>Робочі місця <input type="number" name="max_workers" min="1" value="{{ site.max_workers if site else 300 }}" required></label>
    <label>Місткість складу <input type="number" name="max_storage" min="1" value="{{ site.max_storage if site else 4000 }}" required></label>
    <label>Зарплата за годину <input type="number" name="salary" min="1" value="{{ site.salary if site else 30 }}" required></label>
    <label>Базова ціна ресурсу <input type="number" name="item_price" min="1" value="{{ site.item_price if site else 11 }}" required></label>
    <button type="submit" class="game-panel-action">{{ 'Зберегти' if site else 'Створити' }}</button>
</form>
{% endmacro %}
