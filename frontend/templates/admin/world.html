{% extends 'base.html' %}
{% block title %}Керування мапою світу{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/world_map.css') }}">
<script defer src="{{ url_for('static', path='js/world_geography.js') }}"></script>
<script defer src="{{ url_for('static', path='js/admin_map.js') }}"></script>
{% endblock %}
{% block body %}
<main class="world-admin world-board">
    <h1>Керування мапою світу</h1>
    <p><a href="/admin/map/editor">Редактор меж і маршрутів</a> · <a href="/admin/enterprises">Підприємства</a></p>
    <div class="world-admin-controls">
        <button type="button" id="unlock-next">Відкрити наступну локацію</button>
        <label><input type="checkbox" id="hide-fog" checked> Показувати туман війни</label>
        <label><input type="checkbox" id="show-map-borders"> Показувати межі</label>
        <output id="unlocked-count"></output>
    </div>
    <p id="map-admin-feedback" role="status"></p>
    <div class="world-art">
        <img src="{{ world.config.map.image }}" width="{{ world.config.map.width }}" height="{{ world.config.map.height }}" alt="Карта світу">
        <svg id="admin-map-layer" aria-label="Статус локацій"></svg>
    </div>
    <div class="map-admin-table">
        <table>
            <thead><tr><th scope="col">Локація</th><th scope="col">Статус</th><th scope="col">Сусіди</th><th scope="col">Площа</th><th scope="col">Дія</th></tr></thead>
            <tbody id="map-admin-locations"></tbody>
        </table>
    </div>
    <script type="application/json" id="map-admin-data">{{ world | tojson }}</script>
</main>
{% endblock %}
