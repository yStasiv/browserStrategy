<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бій</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --cell: 56px; }
        body { background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }

        #board-wrap {
            perspective: 1000px;
            min-height: 12rem;
            padding: clamp(0.5rem, 2vw, 1.4rem);
            border: 1px solid #51432e;
            border-radius: 0.8rem;
            background:
                radial-gradient(ellipse at 50% 85%, #495335 0%, transparent 62%),
                linear-gradient(160deg, #293b32, #1d2a25 47%, #171e1b);
        }
        #board {
            position: relative;
            margin: 0 auto;
            border: 2px solid #a88c56;
            border-radius: 0.35rem;
            overflow: hidden;
            box-shadow: 0 9px 0 #342b1c, 0 18px 24px #0b110d;
            transform: rotateX(22deg);
            transform-origin: center bottom;
            background:
                radial-gradient(ellipse at 24% 20%, #7e8750a0, transparent 62%),
                radial-gradient(ellipse at 78% 72%, #99815888, transparent 66%),
                repeating-linear-gradient(113deg, #d6c29813 0 1px, transparent 1px 6px),
                #56613a;
        }
        #cells { display: grid; position: relative; }
        .cell {
            width: var(--cell); height: var(--cell); box-sizing: border-box;
            border: 1px solid #ece2b331;
            background: #242c1510;
        }
        .cell.alt { background: #ddd4ad14; }
        .cell.mv { background: #e0c56680; border-color: #f6e397aa; cursor: pointer; }
        .cell.mv:hover { background: #f5da8799; outline: 1px solid #fff1b5; outline-offset: -2px; }
        .cell.ghost { background: #64b6c785; }
        .cell.hit { background: #ad3f3f9c; border-color: #ff9c8b; }
        .cell.from { background: #d68b5299; }
        @media (max-width: 480px) {
            #board { transform: rotateX(14deg); }
        }

        #stacks, #popups { position: absolute; inset: 0; pointer-events: none; }
        .stack { position: absolute; display: flex; align-items: center; justify-content: center;
                 transition: opacity 0.4s ease; pointer-events: auto; user-select: none; }
        .stack .icon {
            width: 78%; height: 78%; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at 45% 28%, #374f50, #1a2528 70%);
            border: 2px solid #79b6c4;
            box-shadow: 0 5px 0 #172b2d, 0 9px 9px #182416b0;
            transform: rotateX(-22deg);
            text-shadow: 0 2px 4px #050a08;
        }
        .stack.big .icon { width: 90%; height: 87%; border-radius: 30%; }
        .stack.enemy .icon { border-color: #d98f75; background: radial-gradient(ellipse at 45% 28%, #684b38, #302225 70%); }
        .stack.active .icon { box-shadow: 0 0 0 3px #facc15, 0 0 14px 4px rgba(250, 204, 21, 0.7); }
        .stack.target { cursor: crosshair; }
        .stack.target .icon { box-shadow: 0 0 0 2px rgba(248, 113, 113, 0.85); }
        .stack.enemy:hover .icon { background: rgba(127, 29, 29, 0.7); box-shadow: 0 0 0 3px #ef4444, 0 0 16px 5px rgba(239, 68, 68, 0.9); }
        .stack.hl .icon { box-shadow: 0 0 0 3px #fff, 0 0 12px 3px rgba(255, 255, 255, 0.6); }
        .stack.dead { opacity: 0; }
        .badge { position: absolute; right: 2px; bottom: 2px; min-width: 1.3rem; padding: 0 4px; text-align: center; font-size: 0.75rem; font-weight: 700;
                 color: #fff; background: #1e293b; border: 1px solid #94a3b8; border-radius: 9999px; }
        .flag { position: absolute; left: 3px; top: 1px; font-size: 0.8rem; }

        .popup { position: absolute; transform: translateX(-50%); font-weight: 800; font-size: 1.05rem; color: #fff;
                 text-shadow: 0 0 4px #000, 0 0 2px #000; opacity: 0; animation: pop 1.3s ease-out forwards; white-space: nowrap; }
        .popup.ret { color: #fbbf24; }
        @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 6px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -34px); } }

        .chip { position: relative; width: 2.4rem; height: 2.4rem; flex: none; display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
                background: #1e293b; border: 2px solid #3b82f6; border-radius: 0.4rem; }
        .chip.enemy { border-color: #ef4444; }
        .chip.first { box-shadow: 0 0 0 2px #facc15; }
        .chip .badge { font-size: 0.6rem; min-width: 1rem; }

        #log { height: 14rem; overflow-y: auto; font-size: 0.8rem; line-height: 1.3; }
        #log div.ally { color: #93c5fd; }
        #log div.enemy { color: #fca5a5; }
        #log div.sys { color: #94a3b8; }

        .btn { background: #2563eb; color: #fff; padding: 0.5rem 0.9rem; border-radius: 0.5rem; font-weight: 700; }
        .btn:hover:not(:disabled) { background: #1d4ed8; }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        .btn.alt { background: #334155; }
        .btn.alt:hover:not(:disabled) { background: #475569; }
        .btn.danger { background: #991b1b; }
        .btn.danger:hover:not(:disabled) { background: #b91c1c; }
    </style>
</head>
<body>
<div class="max-w-6xl mx-auto p-3">
    <header class="flex items-center justify-between mb-3">
        <h1 class="text-xl font-bold">Бій</h1>
        <a href="/player" class="text-sm text-sky-300 hover:underline">До персонажа</a>
    </header>

    <!-- Вибір бою -->
    <section id="menu" class="hidden">
        <p class="mb-3 text-slate-300">Оберіть супротивника:</p>
        <div id="scenarios" class="flex flex-wrap gap-2 mb-4"></div>
        <section id="battle-history" class="mt-5" aria-label="Завершені бої"></section>
    </section>

    <!-- Бій -->
    <section id="battle" class="hidden">
        <div id="replay-controls" class="hidden flex flex-wrap items-center gap-2 mb-3">
            <button type="button" class="btn" id="replay-play">Відтворити</button>
            <button type="button" class="btn alt" id="replay-restart">З початку</button>
            <button type="button" class="btn alt" id="replay-next-turn">Наступний хід</button>
            <label>Швидкість <select id="replay-speed" class="bg-slate-800"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select>×</label>
            <label>Подія <input id="replay-seek" type="range" min="0" value="0"></label>
            <output id="replay-position" aria-live="polite"></output>
            <button type="button" class="btn alt" id="replay-exit">До списку боїв</button>
        </div>
        <div class="flex items-center gap-2 mb-2">
            <span class="text-xs text-slate-400 shrink-0" title="Прогноз на 50 ходів: не враховує майбутні втрати та «чекати»">Черга (50):</span>
            <div id="initiative" class="flex flex-1 min-w-0 gap-1 overflow-x-auto py-1"></div>
        </div>

        <div class="flex flex-col lg:flex-row gap-3">
            <div id="board-wrap" class="flex-1 min-w-0">
                <div id="board">
                    <div id="cells"></div>
                    <div id="stacks"></div>
                    <div id="popups"></div>
                </div>
            </div>

            <aside class="lg:w-72 shrink-0 space-y-3">
                <div class="bg-slate-800 rounded-lg p-3">
                    <div id="turn-text" class="font-bold mb-1"></div>
                    <div id="active-info" class="text-sm text-slate-300 min-h-[2.5rem]"></div>
                </div>
                <div id="deployment-actions" class="hidden space-y-2">
                    <label class="block">Загін <select id="deployment-stack" class="bg-slate-800"></select></label>
                    <label class="block" id="deployment-split-label">Відокремити істот
                        <input id="deployment-split" class="bg-slate-800 w-16" type="number" min="0" value="0">
                    </label>
                    <p class="text-sm text-slate-300">Обери загін і клітинку в підсвіченій зоні. Нуль означає переміщення всього загону.</p>
                    <button id="deployment-begin" type="button" class="btn">У бій</button>
                </div>
                <div id="battle-actions" class="flex gap-2">
                    <button id="btn-auto" type="button" class="btn alt flex-1" aria-pressed="false">Авто</button>
                    <button id="btn-wait" class="btn alt flex-1" title="Почекати: один раз за бій (W)">Чекати</button>
                    <button id="btn-defend" class="btn alt flex-1" title="Захист (D)">Захист</button>
                    <button id="btn-surrender" class="btn danger flex-1" title="Здатися">Здатись</button>
                </div>
                <div id="log" class="bg-slate-800 rounded-lg p-2"></div>
            </aside>
        </div>
    </section>

    <!-- Підтвердження здачі -->
    <div id="confirm" class="hidden fixed inset-0 z-40 bg-black/70 flex items-center justify-center">
        <div class="bg-slate-800 rounded-xl p-6 text-center max-w-sm">
            <div class="text-lg font-bold mb-2">Здатися?</div>
            <p class="text-sm text-slate-300 mb-4">Бій буде одразу завершено, а перемогу отримає суперник. Нагороду за цей бій ви не отримаєте.</p>
            <div class="flex gap-2 justify-center">
                <button id="confirm-yes" class="btn danger">Так, здатись</button>
                <button id="confirm-no" class="btn alt">Продовжити бій</button>
            </div>
        </div>
    </div>

    <!-- Результат -->
    <div id="result" class="hidden fixed inset-0 z-40 bg-black/70 flex items-center justify-center">
        <div class="bg-slate-800 rounded-xl p-6 text-center">
            <div id="result-title" class="text-2xl font-bold mb-4"></div>
            <p id="result-reward" class="mb-4 text-amber-200" aria-live="polite"></p>
            <div class="flex gap-2 justify-center">
                <button id="btn-new" class="btn">Новий бій</button>
                <button id="btn-replay" class="btn alt">Повтор</button>
                <a href="/player" class="btn alt">До персонажа</a>
            </div>
        </div>
    </div>

    <div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-black/85 text-white text-sm px-4 py-2 rounded"></div>
</div>

<script src="{{ url_for('static', path='js/battle_events.js') }}"></script>
<script>
    // ---------- Конфіг ----------
    const API = '/api/battles';
    // Відображення істот. Назви/емодзі лише для клієнта; правила, цифри й розміри живуть на сервері.
    const UNIT_VIEW = Object.create(null);
    const SCENARIOS = [
        { key: 'training', title: 'Тренувальний бій' },
        { key: 'ruins', title: 'Руїни' },
        { key: 'ogres', title: 'Лігво огрів' },
        { key: 'dragon_lair', title: 'Лігво дракона (з 4 рівня)' },
    ];

    // ---------- Стан клієнта ----------
    let view = null;          // остання відповідь сервера
    let busy = false;
    let auto = false;
    let deploymentStack = null;
    let replay = null;
    let playing = false;
    let playbackGeneration = 0;
    let animation;
    let pollTimer = null;
    const known = {};         // id загону -> {unit, owner} (щоб називати загони, що вже загинули)
    const lastPos = {};       // id загону -> {x, y, w, h} з попереднього відмальовування
    const stackEls = {};      // id загону -> DOM-елемент
    let builtDims = '';

    const $ = (id) => document.getElementById(id);
    const el = {
        menu: $('menu'), battle: $('battle'), scenarios: $('scenarios'),
        cells: $('cells'), stacks: $('stacks'), popups: $('popups'), board: $('board'), wrap: $('board-wrap'),
        initiative: $('initiative'), turnText: $('turn-text'), activeInfo: $('active-info'),
        log: $('log'), result: $('result'), resultTitle: $('result-title'), toast: $('toast'), confirm: $('confirm'),
        btnWait: $('btn-wait'), btnDefend: $('btn-defend'), btnSurrender: $('btn-surrender'),
    };

    // ---------- API ----------
    async function api(path, method = 'GET', body = null) {
        const headers = { 'Content-Type': 'application/json' };
        const token = localStorage.getItem('authToken');
        if (token) headers['Authorization'] = 'Bearer ' + token;
        const res = await fetch(API + path, {
            method, headers, credentials: 'same-origin',
            body: body ? JSON.stringify(body) : undefined,
        });
        let data = null;
        try { data = await res.json(); } catch (e) { /* порожня відповідь */ }
        if (!res.ok) {
            const err = new Error((data && data.detail) || ('Помилка ' + res.status));
            err.status = res.status;
            throw err;
        }
        return data;
    }

    // ---------- Допоміжне ----------
    const cheb = (a, b) => Math.max(Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1]));
    const uv = (unit) => UNIT_VIEW[unit] || { emoji: '❓', name: unit };

    function toast(text, ms = 2800) {
        el.toast.textContent = text;
        el.toast.classList.remove('hidden');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => el.toast.classList.add('hidden'), ms);
    }

    function stackName(id) {
        const k = known[id];
        if (!k) return '?';
        const u = uv(k.unit);
        return u.emoji + ' ' + u.name;
    }

    function isAlly(id) {
        return known[id] && view && known[id].owner === view.my_side;
    }

    function activeStack() {
        const st = view.state;
        return st.active_id ? st.stacks[st.active_id] : null;
    }

    // ---------- Розкладка ----------
    function layout() {
        if (!view || !el.wrap.clientWidth) return;
        const w = view.state.width, h = view.state.height;
        const frame = getComputedStyle(el.wrap);
        const padding = parseFloat(frame.paddingLeft) + parseFloat(frame.paddingRight) || 0;
        const maxW = Math.min(el.wrap.clientWidth - padding - 4, 960);
        const maxH = window.innerHeight * 0.62;
        const cell = Math.max(1, Math.min(72, Math.floor(Math.min(maxW / w, maxH / h)))) + 'px';
        if (el.board.style.getPropertyValue('--cell') !== cell) {
            el.board.style.setProperty('--cell', cell);
        }
    }

    function buildCells() {
        const w = view.state.width, h = view.state.height;
        const dims = w + 'x' + h;
        if (dims === builtDims) return;
        builtDims = dims;
        el.cells.innerHTML = '';
        el.cells.style.gridTemplateColumns = 'repeat(' + w + ', var(--cell))';
        el.board.style.width = 'calc(var(--cell) * ' + w + ' + 4px)';
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const c = document.createElement('div');
                c.className = (x + y) % 2 ? 'cell alt' : 'cell';
                c.dataset.x = x;
                c.dataset.y = y;
                c.addEventListener('click', () => onCellClick(x, y));
                c.addEventListener('mouseenter', () => onCellHover(x, y));
                c.addEventListener('mouseleave', clearHover);
                el.cells.appendChild(c);
            }
        }
    }

    // Клітинки прямокутника w x h з лівим верхнім кутом (x, y)
    function footprint(x, y, w, h) {
        const out = [];
        for (let j = 0; j < h; j++) {
            for (let i = 0; i < w; i++) {
                const c = cellEl(x + i, y + j);
                if (c) out.push(c);
            }
        }
        return out;
    }

    function cellEl(x, y) {
        if (x < 0 || y < 0 || x >= view.state.width || y >= view.state.height) return null;
        return el.cells.children[y * view.state.width + x];
    }

    // Клітинка, на яку клікають, щоб поставити великий загін: його «центр» (лівіше/вище при парному розмірі)
    function centerOffset(s) {
        return [(s.w - 1) >> 1, (s.h - 1) >> 1];
    }

    // ---------- Відмальовування ----------
    function applyView(v, events) {
        view = v;
        Object.assign(UNIT_VIEW, v.units);
        for (const s of Object.values(v.state.stacks)) known[s.id] = { unit: s.unit, owner: s.owner };

        el.menu.classList.add('hidden');
        el.battle.classList.remove('hidden');
        layout();
        buildCells();
        if (events && events.length) showEvents(events);
        renderPanel();
        renderStacks();
        renderInitiative();
        renderHighlights();

        for (const s of Object.values(v.state.stacks)) lastPos[s.id] = { x: s.x, y: s.y, w: s.w, h: s.h };

        if (v.status === 'finished' && !replay) showResult(); else el.result.classList.add('hidden');
        schedulePoll();
    }

    function renderStacks() {
        const stacks = view.state.stacks;
        const activeId = view.deployment ? deploymentStack : view.state.active_id;
        const targetIds = new Set(view.turn ? view.turn.targets.map((t) => t.id) : []);

        for (const s of Object.values(stacks)) {
            let d = stackEls[s.id];
            if (!d) {
                d = document.createElement('div');
                d.innerHTML = '<div class="icon"></div><span class="flag"></span><span class="badge"></span>';
                d.addEventListener('click', () => onStackClick(s.id));
                d.addEventListener('mouseenter', () => onStackHover(s.id));
                d.addEventListener('mouseleave', clearHover);
                el.stacks.appendChild(d);
                stackEls[s.id] = d;
            }
            const u = uv(s.unit);
            d.className = 'stack' + (s.w > 1 || s.h > 1 ? ' big' : '') + (isAlly(s.id) ? '' : ' enemy') +
                          (s.id === activeId ? ' active' : '') + (targetIds.has(s.id) ? ' target' : '');
            d.style.pointerEvents = view.deployment && s.id === deploymentStack ? 'none' : '';
            d.style.left = 'calc(var(--cell) * ' + s.x + ')';
            d.style.top = 'calc(var(--cell) * ' + s.y + ')';
            d.style.width = 'calc(var(--cell) * ' + s.w + ')';
            d.style.height = 'calc(var(--cell) * ' + s.h + ')';
            d.children[0].style.fontSize = 'calc(var(--cell) * ' + (0.5 * Math.min(s.w, s.h)) + ')';
            d.children[0].textContent = u.emoji;
            d.children[1].textContent = s.defending ? '🛡' : '';
            d.children[2].textContent = s.count;
            d.title = u.name + ': ' + s.count + ' шт., HP верхнього: ' + s.top_hp +
                      (s.shots_left > 0 ? ', пострілів: ' + s.shots_left : '');
        }
        for (const id of Object.keys(stackEls)) {
            if (!stacks[id]) {
                const d = stackEls[id];
                d.classList.add('dead');
                setTimeout(() => d.remove(), 450);
                delete stackEls[id];
            }
        }
    }

    function renderInitiative() {
        el.initiative.innerHTML = '';
        const st = view.state;
        if (st.status !== 'active') return;
        const list = view.forecast && view.forecast.length
            ? view.forecast
            : (st.active_id ? [{ id: st.active_id }] : []);
        let first = true;
        for (const f of list) {
            const s = st.stacks[f.id];
            if (!s) continue;
            const c = document.createElement('div');
            c.className = 'chip' + (isAlly(f.id) ? '' : ' enemy') + (first ? ' first' : '');
            first = false;
            c.textContent = uv(s.unit).emoji;
            const b = document.createElement('span');
            b.className = 'badge';
            b.textContent = s.count;
            c.appendChild(b);
            c.title = uv(s.unit).name + ' ×' + s.count;
            c.addEventListener('mouseenter', () => { if (stackEls[f.id]) stackEls[f.id].classList.add('hl'); });
            c.addEventListener('mouseleave', () => { if (stackEls[f.id]) stackEls[f.id].classList.remove('hl'); });
            el.initiative.appendChild(c);
        }
        el.initiative.scrollLeft = 0;
    }

    function renderHighlights() {
        clearHover();
        const a = activeStack();
        const mv = new Set();
        if (view.turn && a) {
            const [ox, oy] = centerOffset(a);
            for (const p of view.turn.move) mv.add((p[0] + ox) + ',' + (p[1] + oy));
        }
        el.cells.querySelectorAll('.cell').forEach((c) => {
            const x = Number(c.dataset.x);
            const width = view.deployment?.zone_width;
            const inZone = width && (view.my_side === 0 ? x < width : x >= view.state.width - width);
            c.classList.toggle('mv', Boolean(inZone) || mv.has(c.dataset.x + ',' + c.dataset.y));
        });
    }

    function renderPanel() {
        const st = view.state;
        const a = activeStack();
        const myTurn = !!view.turn;
        const deploying = Boolean(view.deployment);
        $('battle-actions').classList.toggle('hidden', Boolean(replay) || deploying);
        $('deployment-actions').classList.toggle('hidden', !deploying);

        if (deploying) {
            const owned = Object.values(st.stacks).filter(stack => stack.owner === view.my_side);
            if (!owned.some(stack => stack.id === deploymentStack)) deploymentStack = owned[0]?.id;
            const select = $('deployment-stack');
            select.replaceChildren(...owned.map(stack =>
                new Option(uv(stack.unit).name + ' ×' + stack.count, stack.id)));
            select.value = deploymentStack;
            select.disabled = busy;
            const split = $('deployment-split');
            const max = owned.length < view.deployment.max_slots ? st.stacks[deploymentStack].count - 1 : 0;
            split.max = max;
            split.disabled = busy || max === 0;
            if (Number(split.value) > max) split.value = 0;
            $('deployment-begin').disabled = busy;
            el.turnText.textContent = 'Розстановка загонів';
            el.activeInfo.textContent = `${owned.length}/${view.deployment.max_slots} слотів зайнято`;
            return;
        }

        if (st.status === 'finished') {
            el.turnText.textContent = 'Бій завершено';
            el.activeInfo.textContent = '';
        } else if (a) {
            const u = uv(a.unit);
            el.turnText.textContent = replay ? 'Хід · ' + u.name : (myTurn ? 'Ваш хід' : 'Хід суперника…');
            el.activeInfo.textContent = u.emoji + ' ' + u.name + ' ×' + a.count + ' (HP верхнього: ' + a.top_hp + ')' +
                (a.shots_left > 0
                    ? (view.turn && !view.turn.ranged
                        ? ', ворог поруч — ближній бій (постріли: ' + a.shots_left + ')'
                        : ', постріли: ' + a.shots_left)
                    : '');
        }
        const can = myTurn && !busy && !auto;
        $('btn-auto').disabled = view.status !== 'active';
        $('btn-auto').setAttribute('aria-pressed', String(auto));
        $('btn-auto').textContent = auto ? 'Авто увімкнено' : 'Авто';
        el.btnWait.disabled = !(can && view.turn.can_wait);
        el.btnDefend.disabled = !can;
        el.btnSurrender.disabled = !!replay || busy || view.status !== 'active';   // здатися можна й не у свій хід
    }

    // ---------- Наведення ----------
    function clearHover() {
        el.cells.querySelectorAll('.hit, .from, .ghost').forEach((c) => c.classList.remove('hit', 'from', 'ghost'));
    }

    function onCellHover(x, y) {
        clearHover();
        if (!view || !view.turn) return;
        const a = activeStack();
        const [ox, oy] = centerOffset(a);
        const ax = x - ox, ay = y - oy;
        if (view.turn.move.some((p) => p[0] === ax && p[1] === ay)) {
            footprint(ax, ay, a.w, a.h).forEach((c) => c.classList.add('ghost'));   // де загін опиниться
        }
    }

    function pickFrom(t, a) {
        // null = б'ємо з місця; інакше — найближча з дозволених позицій (ближній бій)
        if (t.from.some((p) => p[0] === a.x && p[1] === a.y)) return null;
        const here = [a.x, a.y];
        return t.from.slice().sort((p, q) => cheb(p, here) - cheb(q, here))[0];
    }

    function onStackHover(id) {
        clearHover();
        if (!view) return;
        const s = view.state.stacks[id];
        if (!s || isAlly(id)) return;
        footprint(s.x, s.y, s.w, s.h).forEach((c) => c.classList.add('hit'));
        if (!view.turn) return;
        const t = view.turn.targets.find((q) => q.id === id);
        if (!t) return;
        const a = activeStack();
        const pos = pickFrom(t, a);
        if (pos) footprint(pos[0], pos[1], a.w, a.h).forEach((c) => c.classList.add('from'));  // звідси загін вдарить
    }

    // ---------- Події: лог і спливаючі числа ----------
    function logLine(text, cls) {
        const d = document.createElement('div');
        d.className = cls;
        d.textContent = text;
        el.log.appendChild(d);
        el.log.scrollTop = el.log.scrollHeight;
    }

    function stackPos(id) {
        const cur = view.state.stacks[id];
        if (cur) return { x: cur.x, y: cur.y, w: cur.w, h: cur.h };
        return lastPos[id] || null;
    }

    function popup(id, text, cls, delay) {
        const p = stackPos(id);
        if (!p) return;
        const d = document.createElement('div');
        d.className = 'popup ' + (cls || '');
        d.textContent = text;
        d.style.left = 'calc(var(--cell) * ' + (p.x + p.w / 2) + ')';
        d.style.top = 'calc(var(--cell) * ' + p.y + ')';
        d.style.animationDelay = delay + 'ms';
        el.popups.appendChild(d);
        setTimeout(() => d.remove(), delay + 1400);
    }

    function showEvents(events) {
        let delay = 0;
        for (const e of events) {
            const actor = e.stack || e.attacker;
            const cls = actor ? (isAlly(actor) ? 'ally' : 'enemy') : 'sys';
            switch (e.type) {
                case 'move':
                    logLine(stackName(e.stack) + ' рухається', cls);
                    break;
                case 'attack':
                    logLine(stackName(e.attacker) + (e.ranged ? ' стріляє в ' : ' атакує ') + stackName(e.target) +
                            ': ' + e.damage + ' шкоди, загинуло ' + e.killed, cls);
                    popup(e.target, '-' + e.damage + (e.killed ? ' 💀' + e.killed : ''), '', delay);
                    delay += 350;
                    break;
                case 'retaliation':
                    logLine(stackName(e.attacker) + ' контратакує ' + stackName(e.target) +
                            ': ' + e.damage + ' шкоди, загинуло ' + e.killed, cls);
                    popup(e.target, '-' + e.damage + (e.killed ? ' 💀' + e.killed : ''), 'ret', delay);
                    delay += 350;
                    break;
                case 'defend':
                    logLine(stackName(e.stack) + ' у захисті', cls);
                    break;
                case 'wait':
                    logLine(stackName(e.stack) + ' чекає', cls);
                    break;
                case 'skip':
                    logLine(stackName(e.stack) + ' пропускає хід', cls);
                    break;
                case 'surrender':
                    logLine(e.side === view.my_side ? 'Ви здалися' : 'Суперник здався', 'sys');
                    break;
                case 'battle_end':
                    logLine('Бій завершено', 'sys');
                    break;
            }
        }
    }

    function showResult() {
        const w = view.winner_side;
        const iSurrendered = view.state.surrendered === view.my_side;
        el.resultTitle.textContent = w === null ? 'Нічия'
            : (w === view.my_side ? 'Перемога!' : (iSurrendered ? 'Ви здалися' : 'Поразка'));
        const {reward} = view;
        const parts = reward && [
            reward.gold > 0 ? `+${reward.gold} золота` : '',
            reward.experience > 0 ? `+${reward.experience} досвіду` : '',
        ].filter(Boolean);
        $('result-reward').textContent = parts
            ? (parts.length ? parts.join(' · ') : 'Нагороду не нараховано.')
            : 'Дані про нагороду недоступні.';
        $('btn-new').classList.toggle('hidden', Boolean(replay));
        $('btn-replay').textContent = replay ? 'Переглянути повторно' : 'Повтор';
        if (replay) {
            el.result.classList.remove('hidden');
            return;
        }
        const battleId = view.id;
        setTimeout(() => {
            if (!replay && view?.id === battleId && view.status === 'finished') el.result.classList.remove('hidden');
        }, 900);   // дати програтися числам шкоди
    }

    // ---------- Дії гравця ----------
    function setBusy(b) {
        busy = b;
        if (view) renderPanel();
    }

    async function send(action) {
        if (replay || busy || auto || !view || view.status !== 'active' || !view.turn) return;
        setBusy(true);
        try {
            const r = await api('/' + view.id + '/actions', 'POST', { version: view.version, action });
            await animateLive(r);
        } catch (e) {
            toast(e.message);
            if (e.status === 409) await refresh();
        } finally {
            setBusy(false);
            schedulePoll();
        }
    }

    async function doSurrender() {
        el.confirm.classList.add('hidden');
        if (replay || busy || !view || view.status !== 'active') return;
        setBusy(true);
        try {
            const r = await api('/' + view.id + '/surrender', 'POST', { version: view.version });
            await animateLive(r);
        } catch (e) {
            toast(e.message);
            if (e.status === 409) await refresh();
        } finally {
            setBusy(false);
            schedulePoll();
        }
    }

    async function deploymentCommand(path, fields = {}) {
        if (busy || !view?.deployment) return;
        setBusy(true);
        try {
            const next = await api('/' + view.id + path, 'POST', {version: view.version, ...fields});
            $('deployment-split').value = 0;
            applyView(next, next.events);
        } catch (error) {
            toast(error.message);
            if (error.status === 409) await refresh();
        } finally {
            setBusy(false);
            schedulePoll();
        }
    }

    function selectDeploymentStack(id) {
        if (busy || view.state.stacks[id]?.owner !== view.my_side) return;
        deploymentStack = id;
        $('deployment-split').value = 0;
        renderPanel();
        renderStacks();
    }

    $('deployment-stack').addEventListener('change', event => selectDeploymentStack(event.target.value));
    $('deployment-begin').addEventListener('click', () => deploymentCommand('/begin'));

    function onCellClick(x, y) {
        if (view?.deployment && deploymentStack) {
            const split = $('deployment-split');
            if (!split.disabled && !split.reportValidity()) return;
            const count = !split.disabled && Number(split.value) > 0 ? Number(split.value) : null;
            const stack = view.state.stacks[deploymentStack];
            if (count === null && stack.x === x && stack.y === y) return;
            deploymentCommand('/deployment', {
                stack_id: deploymentStack, x, y, split_count: count,
            });
            return;
        }
        if (!view || !view.turn) return;
        const a = activeStack();
        const [ox, oy] = centerOffset(a);
        const ax = x - ox, ay = y - oy;
        if (view.turn.move.some((p) => p[0] === ax && p[1] === ay)) send({ type: 'move', x: ax, y: ay });
    }

    function onStackClick(id) {
        if (view?.deployment) { selectDeploymentStack(id); return; }
        if (!view || !view.turn) return;
        const t = view.turn.targets.find((q) => q.id === id);
        if (!t) return;
        send({ type: 'attack', target_id: id, from_pos: pickFrom(t, activeStack()) });
    }

    el.btnWait.addEventListener('click', () => send({ type: 'wait' }));
    el.btnDefend.addEventListener('click', () => send({ type: 'defend' }));
    el.btnSurrender.addEventListener('click', () => el.confirm.classList.remove('hidden'));
    $('confirm-yes').addEventListener('click', doSurrender);
    $('confirm-no').addEventListener('click', () => el.confirm.classList.add('hidden'));
    document.addEventListener('keydown', (ev) => {
        if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
        const k = ev.key.toLowerCase();
        if (ev.key === 'Escape') el.confirm.classList.add('hidden');
        if (!el.confirm.classList.contains('hidden')) return;
        if (k === 'w' && !el.btnWait.disabled) send({ type: 'wait' });
        if (k === 'd' && !el.btnDefend.disabled) send({ type: 'defend' });
    });
    window.addEventListener('resize', layout);
    new ResizeObserver(layout).observe(el.wrap);

    // ---------- Синхронізація ----------
    async function refresh() {
        if (!view) return;
        try {
            const r = await api('/' + view.id);
            if (r.version !== view.version || r.status !== view.status) applyView(r, []);
        } catch (e) {
            toast(e.message);
        }
    }

    // Якщо зараз не наш хід (наприклад, у майбутньому PvP) — опитуємо сервер.
    async function autoTurn() {
        if (!auto || busy || !view?.turn || view.status !== 'active') return;
        setBusy(true);
        try {
            await animateLive(await api('/' + view.id + '/auto', 'POST', {version: view.version}));
        } catch (error) {
            auto = false;
            toast(error.message);
            await refresh();
        } finally {
            setBusy(false);
            schedulePoll();
        }
    }

    $('btn-auto').addEventListener('click', () => {
        auto = !auto;
        renderPanel();
        schedulePoll();
    });

    function schedulePoll() {
        clearTimeout(pollTimer);
        if (replay || busy || !view || view.status !== 'active') return;
        if (view.turn && auto) pollTimer = setTimeout(autoTurn, 250);
        else if (!view.turn) pollTimer = setTimeout(async () => {
            await refresh();
            schedulePoll();
        }, 2000);
    }

    // ---------- Старт ----------
    function resetClientState() {
        Object.keys(known).forEach(id => delete known[id]);
        Object.keys(lastPos).forEach(id => delete lastPos[id]);
        Object.keys(stackEls).forEach((id) => { stackEls[id].remove(); delete stackEls[id]; });
        el.popups.innerHTML = '';
        el.log.innerHTML = '';
        builtDims = '';
        view = null;
        auto = false;
        deploymentStack = null;
    }

    function showMenu() {
        resetClientState();
        el.result.classList.add('hidden');
        el.confirm.classList.add('hidden');
        el.battle.classList.add('hidden');
        el.menu.classList.remove('hidden');
        loadHistory();
    }

    async function startScenario(key) {
        try {
            resetClientState();
            const r = await api('/pve', 'POST', { scenario: key });
            applyView(r, r.events);
        } catch (e) {
            toast(e.message);
            showMenu();
        }
    }

    function buildMenu() {
        el.scenarios.innerHTML = '';
        for (const s of SCENARIOS) {
            const b = document.createElement('button');
            b.className = 'btn';
            b.textContent = s.title;
            b.addEventListener('click', () => startScenario(s.key));
            el.scenarios.appendChild(b);
        }
    }

    async function loadHistory() {
        const history = $('battle-history');
        try {
            const battles = await api('/history');
            history.replaceChildren();

            const title = document.createElement('h2');
            title.textContent = 'Завершені бої';
            history.append(title);
            const list = document.createElement('ul');
            list.className = 'space-y-2 my-3';
            history.append(list);
            for (const battle of battles) {
                const link = document.createElement('button');
                link.className = 'btn alt m-1';
                link.textContent = battle.available ? `Повтор №${battle.id}` : `Бій №${battle.id} · повтор недоступний`;
                link.disabled = !battle.available;
                link.addEventListener('click', () => openReplay(battle.id));
                const row = document.createElement('li');
                row.append(link);
                list.append(row);
            }
            const all = document.createElement('a');
            all.className = 'btn alt inline-block';
            all.href = '/battle/history';
            all.textContent = 'Переглянути всі бої';
            history.append(all);
        } catch (error) {
            history.textContent = error.message;
        }
    }

    async function animateEvent(event, state, speed) {
        const entry = BattleEvents.logEvent(event);
        if (entry) showEvents([entry]);
        const effect = BattleEvents.animate(event, stackEls, state,
            el.cells.firstElementChild.offsetWidth, speed);
        animation = effect;
        if (effect) await effect.finished.catch(() => {});
        if (animation === effect) animation = null;
    }

    async function animateLive(result) {
        if (!view || !result.event_stream?.length) {
            applyView(result, result.events);
            return;
        }
        const state = structuredClone(view.state);
        view = {...view, state, turn: null};
        for (const event of result.event_stream) {
            await animateEvent(event, state, 1);
            BattleEvents.apply(state, event);
            renderStacks();
        }
        applyView(result, []);
    }

    function pauseReplay() {
        playing = false;
        playbackGeneration++;
        animation?.cancel();
        $('replay-play').textContent = 'Відтворити';
    }

    function replayView(state) {
        return {
            id: replay.battle_id, my_side: replay.my_side, state, status: state.status,
            winner_side: state.winner, reward: replay.reward, turn: null,
            forecast: state.active_id ? [{id: state.active_id}] : [],
        };
    }

    function replayLog(event) {
        const entry = BattleEvents.logEvent(event);
        if (!entry) return;
        const actor = entry.stack || entry.attacker;
        const description = {
            move: 'рухається', attack: `завдає ${entry.damage} шкоди`,
            retaliation: `контратакує, ${entry.damage} шкоди`, defend: 'у захисті',
            wait: 'чекає', skip: 'пропускає хід', surrender: 'Сторона здалася',
            battle_end: 'Бій завершено',
        };
        logLine(actor ? `${stackName(actor)} ${description[entry.type]}` : description[entry.type], 'sys');
    }

    function updateReplay(state, cursor) {
        replay.cursor = cursor;
        $('replay-seek').value = cursor;
        applyView(replayView(state), []);
        if (cursor === replay.events.length && state.status === 'finished') showResult();
        const result = state.status === 'finished' ?
            (state.winner === null ? 'Нічия' : state.winner === replay.my_side ? 'Перемога' : 'Поразка') : '';
        $('replay-position').textContent =
            `${cursor}/${replay.events.length}${replay.partial ? ' · частковий повтор' : ''}${result ? ' · ' + result : ''}`;
    }

    function seekReplay(cursor) {
        pauseReplay();
        const state = structuredClone(replay.initial_state);
        resetClientState();
        view = replayView(state);
        for (const stack of Object.values(state.stacks)) known[stack.id] = stack;
        for (const event of replay.events.slice(0, cursor)) {
            replayLog(event);
            BattleEvents.apply(state, event);
        }
        updateReplay(state, cursor);
    }

    async function playReplay() {
        if (playing) { pauseReplay(); return; }
        if (replay.cursor === replay.events.length) seekReplay(0);
        const generation = ++playbackGeneration;
        playing = true;
        $('replay-play').textContent = 'Пауза';
        while (generation === playbackGeneration && replay.cursor < replay.events.length) {
            const event = replay.events[replay.cursor];
            const speed = Number($('replay-speed').value);
            await animateEvent(event, view.state, speed);
            if (generation !== playbackGeneration) return;
            BattleEvents.apply(view.state, event);
            updateReplay(view.state, replay.cursor + 1);
            await new Promise(resolve => setTimeout(resolve, 100 / speed));
        }
        if (generation === playbackGeneration) pauseReplay();
    }

    async function openReplay(id) {
        try {
            replay = await api('/' + id + '/replay');
            Object.assign(UNIT_VIEW, replay.units);
            if (replay.schema_version !== 1) throw new Error('Ця версія повтору не підтримується.');
            $('replay-controls').classList.remove('hidden');
            $('replay-seek').max = replay.events.length;
            seekReplay(0);
        } catch (error) {
            replay = null;
            toast(error.message);
        }
    }

    $('btn-new').addEventListener('click', showMenu);
    $('btn-replay').addEventListener('click', () => {
        if (replay) {
            seekReplay(0);
            playReplay();
        } else {
            openReplay(view.id);
        }
    });
    $('replay-play').addEventListener('click', playReplay);
    $('replay-restart').addEventListener('click', () => seekReplay(0));
    $('replay-seek').addEventListener('input', event => seekReplay(Number(event.target.value)));
    $('replay-next-turn').addEventListener('click', () => {
        const index = replay.events.findIndex((event, i) => i >= replay.cursor && event.type === 'TURN_STARTED');
        seekReplay(index === -1 ? replay.events.length : index + 1);
    });
    $('replay-exit').addEventListener('click', () => {
        pauseReplay();
        replay = null;
        $('replay-controls').classList.add('hidden');
        showMenu();
    });

    window.addEventListener('pageshow', event => {
        if (event.persisted) location.reload();
    });

    (async function init() {
        buildMenu();
        const replayId = new URLSearchParams(location.search).get('replay');
        if (/^\d+$/.test(replayId || '')) {
            showMenu();
            await openReplay(replayId);
            return;
        }
        try {
            const r = await api('/active');   // є незавершений бій — продовжуємо його
            applyView(r, []);
        } catch (e) {
            if (e.status === 401) { toast('Потрібна авторизація'); }
            showMenu();
        }
    })();
</script>
</body>
</html>
