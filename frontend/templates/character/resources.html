<dl class="hero-stats hero-resource-cards" aria-label="Ресурси персонажа">
    {% for resource in profile.resources %}
    <div tabindex="0" class="hero-stat-card" data-resource-id="{{ resource.id }}" title="{{ resource.name }} · {{ resource.quantity }}{% if resource.description %} · {{ resource.description }}{% endif %}">
        <dt>
            {% if resource.icon %}<img class="hero-stat-icon" src="{{ resource.icon }}" alt="">
            {% elif not resource.conditional %}<span class="hero-stat-icon" aria-hidden="true">◆</span>{% endif %}
            <span class="hero-stat-tooltip">{{ resource.name }}</span>
        </dt>
        <dd><strong>{{ "{:,}".format(resource.quantity) }}</strong></dd>
    </div>
    {% endfor %}
</dl>
