<dialog class="news-popup hero-panel" id="news-popup" data-confirm-only aria-labelledby="news-popup-title">
    <h2 id="news-popup-title"></h2>
    <time id="news-popup-date"></time>
    <img id="news-popup-image" class="news-image" alt="" hidden>
    <p class="news-text" id="news-popup-text"></p>
    <p><a id="news-popup-link" hidden rel="noopener noreferrer" target="_blank">Перейти за посиланням</a></p>
    <button id="news-acknowledge" class="news-button" type="button">Ознайомився</button>
    <p id="news-popup-feedback" role="status"></p>
</dialog>
