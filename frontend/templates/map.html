{% extends 'base.html' %}
{% block title %}Карта світу{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/world_map.css') }}">
<script defer src="{{ url_for('static', path='js/world_map.js') }}"></script>
{% endblock %}
{% block body %}
<main class="world-page" lang="uk">
    <section class="world-board" aria-labelledby="world-title">
        <h1 id="world-title">Карта світу</h1>
        <p id="world-current"></p>
        <p id="world-work-notice" hidden>Під час роботи залишити сектор неможливо.</p>
        <div class="world-art">
            <img src="{{ url_for('static', path='images/map_v1.png') }}" alt="Ілюстрація карти світу">
            <div id="world-markers"></div>
        </div>
        <div class="world-travel" id="world-travel" hidden>
            <label for="world-progress" id="world-travel-label"></label>
            <progress id="world-progress" value="0" max="1"></progress>
            <p id="world-time"></p>
        </div>
        <p id="world-feedback" role="status"></p>
        <button type="button" id="world-refresh" hidden>Оновити стан</button>
        <h2>Сектори</h2>
        <ul id="world-sectors" class="world-sectors"></ul>
    </section>
    <aside class="world-side" aria-label="Місцеві можливості">
        <section class="world-board">
            <h2>Підприємства</h2>
            <p id="world-enterprise-message"></p>
            <ul id="world-enterprises" class="world-enterprises"></ul>
            <p id="world-castle-links" hidden><a href="/castle">Замок</a> · <a href="/guild">Гільдія авантюристів</a></p>
        </section>
        <section class="world-board">
            <h2>Полювання</h2>
            <ul id="world-hunts" class="world-enterprises"></ul>
            <p id="world-hunt-feedback" role="status"></p>
        </section>
    </aside>
    <script type="application/json" id="world-state">{{ world | tojson }}</script>
</main>
{% endblock %}
