{% extends 'base.html' %}
{% block title %}Новий нікнейм{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/character_dashboard.css') }}">
{% endblock %}
{% block body %}
<main class="hero-dashboard">
    <section class="hero-panel">
        <h1>Обери новий нікнейм</h1>
        <p>Твій тимчасовий нікнейм · {{ temporary_name }}</p>
        {% if error %}<p role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="/choose-nickname">
            <label for="new-username">Новий нікнейм</label>
            <input id="new-username" name="username" maxlength="50" autocomplete="off" required autofocus>
            <button class="hero-link" type="submit">Зберегти й увійти</button>
        </form>
        <form method="post" action="/logout"><button class="hero-link" type="submit">Вийти</button></form>
    </section>
</main>
{% endblock %}
